<html>
<head>
  <meta charset="utf-8">
  <title>ThunderNotes</title>
  <style>
    :root { color-scheme: light dark; --muted: #777; --hover: #0000000c; --line: #00000014; --warn: #b4421c; }
    @media (prefers-color-scheme: dark) { :root { --muted: #aaa; --hover: #ffffff12; --line: #ffffff1c; --warn: #ff9466; } }
    /* The list scrolls inside its own 360 x 520 box: a vertical scrollbar then takes room from
       the content (which wraps) instead of making the page 15px too wide. */
    html { overflow: hidden; }
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 360px; max-height: 520px; overflow-y: auto; overflow-x: hidden; }
    /* Everything wraps within the 360px, never wider: no sideways scrolling. (No vw units: a
       popup takes its size from its content, so "100vw" made it collapse.) */
    li, .text, .status, .backup, #syncWarning, .sync-line, .sync-details, .restore { overflow-wrap: anywhere; }
    .restore { max-width: 100%; white-space: normal; text-align: left; }
    /* Backlinks (D37): the emails whose notes link here. */
    .linked-head { padding: 8px 12px 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-top: 1px solid var(--line); }
    .linked-subject { font-weight: 600; }
    /* Restore (D33): below a line, apart from the list, in the accent colour. */
    .restore-bar { border-top: 1px solid var(--line); margin-top: 4px; padding: 8px 12px; }
    .restore { padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 12px;
               border: 1px solid #0b57d0; background: #e8f0fe; color: #0b57d0; }
    .restore:hover { background: #d2e3fc; }
    .restore-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
    .purge { font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .purge:hover, .purge.armed { color: #c92a2a; }
    .purge.armed { font-weight: 600; }
    .sync-item button.armed { background: #c92a2a; border-color: #c92a2a; color: #fff; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .restore { border-color: #8ab4f8; background: #1f2b3d; color: #8ab4f8; } .restore:hover { background: #283a55; }
    }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
    header img { width: 20px; height: 20px; }
    header .count { margin-left: auto; color: var(--muted); font-size: 11px; white-space: pre; }
    ul { list-style: none; margin: 0; padding: 0 0 6px; }
    li { padding: 7px 12px; cursor: pointer; border-top: 1px solid var(--line); }
    li:hover { background: var(--hover); }
    .quote { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6b5d1a; }
    @media (prefers-color-scheme: dark) { .quote { color: #d8c66a; } }
    .email .quote { font-style: normal; font-weight: 600; }
    .text { color: inherit; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .text.none { color: var(--muted); }
    .status { font-size: 11px; color: var(--warn); }
    .empty { padding: 12px; color: var(--muted); }
    .backup { margin: 0 12px 8px; padding: 6px 8px; font-size: 12px; border-radius: 6px; color: var(--warn);
              background: color-mix(in srgb, var(--warn) 10%, transparent); }
    .backup a { color: inherit; cursor: pointer; text-decoration: underline; }
    /* Sync warning (D35): a clear red line, details on click. */
    #syncWarning { color: #c92a2a; background: color-mix(in srgb, #e03131 12%, transparent); border: 1px solid #e0313160; }
    @media (prefers-color-scheme: dark) { #syncWarning { color: #ff8787; } }
    .sync-line { display: block; font-weight: 600; cursor: pointer; text-decoration: none !important; }
    .sync-details p { margin: 6px 0 0; font-weight: normal; }
    .sync-tech { opacity: 0.75; font-size: 11px; overflow-wrap: anywhere; }
    .sync-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-weight: normal; }
    .sync-item span { overflow-wrap: anywhere; }
    .sync-item button { flex: none; font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
                        border: 1px solid #c92a2a; background: #fff; color: #c92a2a; }
    .sync-item button:hover { background: #ffe3e3; }
    footer { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; justify-content: space-between; }
    footer a { color: inherit; opacity: 0.8; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <header><img src="icons/icon.svg" alt=""> <b>ThunderNotes</b> <span class="count" id="count"></span></header>
  <div id="syncWarning" class="backup" hidden></div>
  <ul id="list"></ul>
  <div id="backup" class="backup" hidden>
    Notes on emails in local folders or POP accounts are stored only in Thunderbird and are lost if the add-on is removed.
    Last export: <span id="lastExport"></span>. <a id="exportNow">Export now…</a>
  </div>
  <footer><a id="tasks">All tasks…</a><a id="copyAll" hidden title="The email's notes in reading order, each passage quoted, links to emails as references">Copy all as Markdown</a><a id="options">Export / import…</a></footer>
  <script src="dist/popup.js"></script>
</body>
</html>
